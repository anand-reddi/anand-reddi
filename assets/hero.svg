<style>
  .f{opacity:1;animation:in .6s ease-out both}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .spin{animation:spin 18s linear infinite} .rev{animation-duration:9s;animation-direction:reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  .blink{animation:blink 1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
  .scan{animation:scan 5s linear infinite} @keyframes scan{from{transform:translateY(0)}to{transform:translateY(470px)}}
  .dot{animation:pulse 1.6s ease-in-out infinite} @keyframes pulse{50%{opacity:.25}}
</style>
